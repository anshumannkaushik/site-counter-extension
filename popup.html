<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Site Counter v1.4</h1>
  <p class="sub">Counts the mapped site rows on your open hotel tabs. Output is CSV with 2 columns only: site count, sites.</p>
  <div class="row">
    <button id="checkCurrent">Check current tab</button>
    <button id="checkAll" class="dark">Check all hotel tabs</button>
    <button id="copyBtn" class="dark">Copy CSV</button>
    <button id="downloadBtn" class="dark">Download CSV</button>
  </div>
  <div id="status">Open your hotel tabs, then check.</div>
  <pre id="result"></pre>
  <script src="popup.js"></script>
</body>
</html>
